# ArqueoGal WSL2 kernel tuning
# Apply via: sudo cp etc/sysctl.d/99-arqueogal.conf /etc/sysctl.d/ && sudo sysctl --system

# Prefer freeing page cache over swapping; 60 (default) causes thrashing under memory pressure.
vm.swappiness = 10

# Keep directory and inode caches; default 100 evicts too aggressively.
vm.vfs_cache_pressure = 50

# Heuristic overcommit (default); appropriate for our scientific workloads.
vm.overcommit_memory = 0

# Do not panic on OOM; kill the offending process. WSL2 may still shut down the VM
# if the kill cannot recover memory; the .wslconfig swap budget mitigates this.
vm.panic_on_oom = 0
