[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arqueogal"
version = "0.1.0"
description = "ML pipelines for Galactic archaeology: XP→abundances and stellar population classification"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Andreas W. Neitzel", email = "andreaswneitzel@astro.up.pt"},
]
keywords = ["galactic-archaeology", "stellar-populations", "gaia", "apogee", "machine-learning"]

# Runtime deps are managed by the monolithic venv — this list is for documentation only.
# Do NOT use `pip install -e .` to pull these; they are already installed.
dependencies = [
    "aim>=3.29.1",
    "pyvo>=1.8.1",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PLR (Pylint refactor) is intentionally excluded: too-many-arguments,
# too-many-statements, too-many-branches are advisory style rules that
# mis-fire on plotting helpers, numerical recipes, and CLI drivers in
# scientific Python. Real-bug categories (E, F, W, B) stay on.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    "N803",   # argument name should be lowercase: astronomical variables (M_sun, etc.)
    "N806",   # variable in function should be lowercase: same reason
    "E741",   # ambiguous variable name: L, I, l are valid in math / linear algebra
    "E402",   # module-import-not-at-top-of-file: CLI scripts append sys.path first
    "E702",   # multiple-statements-on-one-line-semicolon: common in test fixtures
    "E701",   # multiple-statements-on-one-line-colon: same
    "B905",   # zip() without strict=: pervasive scientific-Python pattern
    "B904",   # raise-without-from-inside-except: verbose noise for low-level helpers
    "B017",   # assert-raises-exception: wide pytest.raises is sometimes the intent
    "SIM108", # if-else-block-instead-of-if-exp: readability call is project-style
    "UP037",  # quoted annotation: defer to pyright runtime semantics
    "UP047",  # PEP 695 generic syntax not yet broadly used
    "N812",   # `import torch.nn.functional as F` is universal PyTorch idiom
]

[tool.ruff.lint.per-file-ignores]
# Test names like `test_..._L` (matrix L) are descriptive and must not be lowercased.
"tests/**/*.py" = ["N802"]
# CLI scripts have long log/format strings; line-length policing is noise here.
"scripts/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["arqueogal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "slow: integration tests invoking real galpy/astropy (seconds each)",
    "gpu: tests that require a CUDA device and the production checkpoint",
    "stress: hybrid stress-battery tests, opt-in via --run-stress",
]

[dependency-groups]
dev = [
    "astropy>=6",
    "jupytext>=1.19.1",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyarrow>=15",
    "pytest>=9.0.3",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.0",
]
