# Population Classifier: FIRE-2 Hare-and-Hounds Configuration
# ============================================================
# Subtask 5.1: Blind validation on FIRE-2 synthetic Milky Way-like galaxies.

paths:
  output_root: output/population_classifier/fire2

data:
  # One config per galaxy+observer combination. Override these per run.
  # NOTE: m12i, m12f, m12m are NON-bimodal or weakly bimodal in [α/Fe].
  # Strongly bimodal FIRE-2 galaxies: Louise, Remus, Romulus, Romeo, Juliet.
  # Check which have Ananke synthetic surveys (Nguyen+2024).
  fire2_galaxy: m12i
  observer_position: 0         # 0, 1, or 2 (three heliocentric-like LSR positions)
  data_file: data/processed/fire2_m12i_obs0_5d.parquet

  # 5D baseline feature set (per proposal)
  feature_columns: [age, fe_h, alpha_fe, V, UV_mag]
  feature_latex:
    - "$\\mathrm{Age\\ (Gyr)}$"
    - "$\\mathrm{[Fe/H]}$"
    - "$\\mathrm{[\\alpha/Fe]}$"
    - "$V\\ (\\mathrm{km/s})$"
    - "$\\sqrt{U^2 + W^2}\\ (\\mathrm{km/s})$"

  # Ground truth columns (available in FIRE-2, hidden from hound)
  ground_truth:
    population_column: population_label    # thin_disk, thick_disk, halo_insitu, halo_accreted
    circularity_column: circularity
    exsitu_column: exsitu_flag

  # Error convolution
  errors:
    enabled: true
    age_sigma_rel: 0.20          # relative (log-normal)
    fe_h_sigma: 0.08             # dex (Gaussian), increased to 0.15 below [Fe/H] < -1.5
    fe_h_sigma_metal_poor: 0.15
    fe_h_metal_poor_threshold: -1.5
    alpha_fe_sigma: 0.04         # dex (Gaussian)
    V_sigma_near: 2.0            # km/s (< 2 kpc)
    V_sigma_far: 5.0             # km/s (> 2 kpc)
    UV_mag_sigma_near: 3.0       # km/s
    UV_mag_sigma_far: 8.0        # km/s
    distance_threshold_kpc: 2.0
    random_seed: 42

# Extended feature sets (test against baseline)
extended_features:
  set_a:
    columns: [age, fe_h, alpha_fe, mg_fe, V, UV_mag]
    description: "5D + [Mg/Fe]"
  set_b:
    columns: [age, fe_h, alpha_fe, V, UV_mag, eccentricity, Z_max]
    description: "5D + orbital params"
  set_c:
    columns: [age, fe_h, alpha_fe, V, UV_mag, L_z, E_tot]
    description: "5D + integrals of motion"

umap:
  # Clustering embedding (higher-D)
  clustering:
    n_neighbors: 30
    n_components: 5              # cluster in 5D UMAP, NOT 2D
    min_dist: 0.0
    metric: euclidean
    init: spectral
    random_state: 42
  # Visualization embedding (2D)
  visualization:
    n_neighbors: 15
    n_components: 2
    min_dist: 0.1
    metric: euclidean
    init: spectral
    random_state: 42

hdbscan:
  min_cluster_size: 100
  min_samples: 50
  prediction_data: true          # needed for soft clustering

monte_carlo:
  n_realizations: 200            # error propagation realizations
  random_seed: 42

bootstrap:
  n_resamples: 100
  stability_threshold: 0.80     # clusters below this are flagged as unstable
  matching_metric: jaccard       # jaccard | overlap
  random_seed: 42

evaluation:
  metrics: [ari, nmi, completeness, purity, f1, confusion_matrix]
  per_population: true           # report metrics per population, not just global
  sensitivity_analysis: true     # vary error levels, report metric degradation

plotting:
  figure_format: png
  dpi: 300
  embedding_point_size: 0.5
  embedding_alpha: 0.3
