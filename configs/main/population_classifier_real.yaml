# Population Classifier: Real Data Configuration
# ================================================
# Subtask 5.2: Application to TESS+Gaia+APOGEE target stars.

paths:
  output_root: output/population_classifier/real

data:
  data_file: data/processed/tess_gaia_apogee_5d.parquet
  feature_columns: [age, fe_h, alpha_fe, V, UV_mag]
  feature_latex:
    - "$\\mathrm{Age\\ (Gyr)}$"
    - "$\\mathrm{[Fe/H]}$"
    - "$\\mathrm{[\\alpha/Fe]}$"
    - "$V\\ (\\mathrm{km/s})$"
    - "$\\sqrt{U^2 + W^2}\\ (\\mathrm{km/s})$"
  source_id_column: source_id

  # Per-star error columns (for MC error propagation)
  error_columns:
    age: age_err
    fe_h: fe_h_err
    alpha_fe: alpha_fe_err
    V: V_err
    UV_mag: UV_mag_err

umap:
  clustering:
    n_neighbors: 30
    n_components: 5
    min_dist: 0.0
    metric: euclidean
    init: spectral
    random_state: 42
  visualization:
    n_neighbors: 15
    n_components: 2
    min_dist: 0.1
    metric: euclidean
    init: spectral
    random_state: 42

hdbscan:
  min_cluster_size: 100
  min_samples: 50
  prediction_data: true

monte_carlo:
  n_realizations: 200
  random_seed: 42

bootstrap:
  n_resamples: 100
  stability_threshold: 0.80
  matching_metric: jaccard
  random_seed: 42

# No ground truth — internal validation only
validation:
  silhouette: true
  physical_consistency: true
  # Check recovered clusters against known population definitions
  cross_reference:
    alpha_bimodality: true       # do clusters separate high-α from low-α?
    gaia_enceladus: true         # is there a cluster consistent with GE kinematics?
    age_metallicity: true        # do clusters show coherent AMR?

plotting:
  figure_format: png
  dpi: 300
  embedding_point_size: 0.5
  embedding_alpha: 0.3
